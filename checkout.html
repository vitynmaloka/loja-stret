<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout - Vityn Store</title>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
body { font-family: Arial, sans-serif; background:#b0b0b0; margin:0; padding:20px;}
header { display:flex; align-items:center; margin-bottom:20px; }
header h2 { font-family: 'Permanent Marker', cursive; color:#ff4081; font-size:28px; margin:0; }
.back-btn { margin-right:15px; font-size:28px; cursor:pointer; color:#111; text-decoration:none; }
.container { background:#fff; border-radius:15px; padding:20px; max-width:600px; margin:auto; }
.cart-item { display:flex; gap:15px; border-bottom:1px solid #ddd; padding:10px 0; }
.cart-item img { width:80px; border-radius:10px; }
.cart-item div { flex:1; }
.total { font-weight:bold; font-size:20px; text-align:right; margin-top:15px; }
.finalizar-btn { width:100%; padding:15px; margin-top:20px; border:none; border-radius:12px; background:#25D366; color:white; font-weight:bold; font-size:18px; cursor:pointer; }
</style>
</head>
<body>

<header>
    <a class="back-btn" href="index.html">←</a>
    <h2>Resumo do Pedido</h2>
</header>

<div class="container">
    <div id="cart-items"></div>
    <div class="total" id="total">Total: R$ 0.00</div>
    <button class="finalizar-btn" onclick="finalizarCompra()">Finalizar Compra</button>
</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || {};

function renderCart(){
    const cartDiv = document.getElementById("cart-items");
    cartDiv.innerHTML = "";
    let total = 0;
    for(let key in cart){
        const item = cart[key];
        total += item.price * item.quantity;
        cartDiv.innerHTML += `
        <div class="cart-item">
            <img src="${item.img}" alt="${item.name}">
            <div>
                <strong>${item.name}</strong> (${item.size})<br>
                R$ ${item.price.toFixed(2)} x ${item.quantity}
            </div>
        </div>
        `;
    }
    document.getElementById("total").innerText = "Total: R$ " + total.toFixed(2);
}

function finalizarCompra(){
    if(Object.keys(cart).length === 0){
        alert("O carrinho está vazio!");
        return;
    }
    let mensagem = "Olá, gostaria de comprar:%0A";
    for(let key in cart){
        const item = cart[key];
        mensagem += `${item.name} (${item.size}) x ${item.quantity} - R$ ${item.price.toFixed(2)}%0A`;
    }
    let total = 0;
    for(let key in cart) total += cart[key].price * cart[key].quantity;
    mensagem += `Total: R$ ${total.toFixed(2)}`;
    // WhatsApp link
    window.open(`https://wa.me/5595991256438?text=${mensagem}`, "_blank");
}

window.onload = renderCart;
</script>

</body>
</html>
